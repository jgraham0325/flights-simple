repos:
  - repo: https://github.com/psf/black
    rev: 24.2.0  # Use the latest stable version
    hooks:
      - id: black
        files: ^src/
        args: [--line-length=88]  # Set line length to 88

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: ^src/
        args: [--max-line-length=88]  # Set max line length to 88

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        files: ^src/

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.5.0
    hooks:
      - id: pyupgrade
        files: ^src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.4.1  # Use the latest stable version
    hooks:
      - id: mypy
        files: ^src/